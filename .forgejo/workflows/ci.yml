# CI on opencommit.eu. Forgejo reads .forgejo/workflows and, because this
# directory exists, skips .github/workflows: those stay GitHub's. What is
# left out here runs on GitHub instead, on pushes made there directly:
#   - Windows and macOS: opencommit.eu has Linux runners only.
#   - CodeQL and the Trivy scan: they report to GitHub's Security tab.
#   - The Nix flake check: it needs a Nix install the runner container lacks.
name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      # The ruff of uv.lock, without installing streamrip.
      - run: uv run --locked --only-group dev ruff check .
      - run: uv run --locked --only-group dev ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      # --locked fails when uv.lock no longer matches pyproject.toml.
      - name: Install dependencies
        run: uv sync --locked --all-extras --python 3.15
      - name: Run tests
        # The tests about logins and sessions run by hand: checks/run.py login.
        run: uv run --locked pytest -m "not login"

  # Installing the way users do on Linux: the installer fetches uv and
  # Python 3.15 itself, and fails when streamrip --version does.
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ./install.sh && .venv/bin/streamrip --help

  # The tests on arm64, on the pi. The pi is at home: a pull request reaches it
  # only from a branch of this repository (Patchbot's included), never from
  # someone else's fork.
  test-arm64:
    if: >-
      github.event_name == 'push'
      || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: pi
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked --all-extras --python 3.15
      - run: uv run --locked pytest -m "not login"

  # Real accounts, from home (services refuse data centres), with the
  # STREAMRIP_CONFIG secret: a whole config.toml. Never for pull requests.
  live:
    if: >-
      github.ref == 'refs/heads/dev'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [lint, test]
    runs-on: pi
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: One track from each service
        env:
          STREAMRIP_CONFIG: ${{ secrets.STREAMRIP_CONFIG }}
        run: |
          if [ -z "$STREAMRIP_CONFIG" ]; then
            echo "No STREAMRIP_CONFIG secret: offline tests only."
            exit 0
          fi
          config="$(mktemp)"  # 0600: it holds the logins
          trap 'rm -f "$config"' EXIT
          printf '%s\n' "$STREAMRIP_CONFIG" > "$config"
          uv run --locked --all-extras python checks/run.py live qobuz tidal deezer \
            --config "$config" < /dev/null
