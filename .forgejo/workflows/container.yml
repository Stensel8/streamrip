# The image for opencommit.eu/stensel8/streamrip. A pull request only builds it.
# A v* tag, or "Run workflow" with an existing tag, builds amd64 on the shared
# runner and arm64 on the pi, then joins them under the version, its minor and
# `latest`. "Run workflow" without a tag builds and tests both, and publishes
# nothing. Only tags and runs by hand reach the pi, which is at home.
#
# Pushing needs the secret REGISTRY_TOKEN: a token of Stensel8 with write:package.
name: Container

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - Containerfile
      - .dockerignore
      - .forgejo/workflows/container.yml
      - pyproject.toml
      - uv.lock
      - README.md
      - LICENSE
      - streamrip/**
  workflow_dispatch:
    inputs:
      tag:
        description: A tag to build and publish again, like v2.7.0. Empty to only build and test.
        required: false

env:
  IMAGE: opencommit.eu/stensel8/streamrip
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          docker buildx build --load --tag streamrip:ci .
          docker run --rm streamrip:ci --version
          docker image rm streamrip:ci

  build:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-latest, pi]
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: Build, test and push
        shell: bash
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          case "$(uname -m)" in x86_64) arch=amd64 ;; aarch64) arch=arm64 ;; esac
          version=""; [[ "$TAG" == v[0-9]* ]] && version="${TAG#v}"
          image="$IMAGE:${version:-test}-$arch"
          # The login stays in this run; the build cache stays in the docker daemon.
          export DOCKER_CONFIG="$(mktemp -d)"
          trap 'rm -rf "$DOCKER_CONFIG"; docker image rm --force "$image" >/dev/null 2>&1 || true' EXIT

          docker buildx build --load --tag "$image" \
            --label "org.opencontainers.image.version=${version:-dev}" \
            --label "org.opencontainers.image.revision=$(git rev-parse HEAD)" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" .
          docker run --rm "$image" --version
          [[ -n "$version" ]] || exit 0   # without a tag: built and tested, nothing to publish
          test "$(docker run --rm "$image" --version)" = "streamrip, version $version"

          docker login opencommit.eu --username Stensel8 --password-stdin <<<"$REGISTRY_TOKEN"
          docker push "$image"

  manifest:
    if: github.event_name == 'push' || github.event.inputs.tag != ''
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Join the architectures
        shell: bash
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          tags=(--tag "$IMAGE:$version")
          # A stable release also moves its minor tag (2.6), and `latest`.
          if [[ "$version" != *-* ]]; then
            tags+=(--tag "$IMAGE:${version%.*}" --tag "$IMAGE:latest")
          fi
          export DOCKER_CONFIG="$(mktemp -d)"
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          docker login opencommit.eu --username Stensel8 --password-stdin <<<"$REGISTRY_TOKEN"
          docker buildx imagetools create "${tags[@]}" "$IMAGE:$version-amd64" "$IMAGE:$version-arm64"
