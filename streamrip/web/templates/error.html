{# What a browser that asked for a page (not the app's own requests) gets for an error. #}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Error · streamrip</title>
  <link rel="icon" href="{{ url_for('static', filename='icon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', filename='error.css') }}">
</head>
<body>
  <main>
    <p><strong>Error {{ status }}.</strong> {{ message }}</p>
    <p><a href="/">Back to streamrip</a></p>
  </main>
</body>
</html>
