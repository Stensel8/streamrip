# streamrip config
#
# Lines starting with # are comments. Every option is set to its default, and
# the defaults give the highest quality there is. To lower it, use [conversion].
# Logins are not kept here but in state.toml, next to this file.


# -----------------------------------------------------------------------------
# DOWNLOADS: where files go, and how fast
# -----------------------------------------------------------------------------
[downloads]

# Where files are saved. Empty means your Music folder.
# Options: a folder path
folder = ""

# -- Folders --

# One subfolder per album. Off puts every track straight in the downloads
# folder, and then saved artwork and Qobuz booklets are skipped (albums would
# overwrite each other's cover.jpg).
# Options: true, false
create_album_folder = true

# A folder per source inside the downloads folder: 'Qobuz', 'Tidal', and so on.
# Options: true, false
source_subdirectories = false

# A `Disc N` subfolder for albums with two or more discs.
# Options: true, false
disc_subdirectories = true

# -- Speed --

# How many tracks download at once. More than your connection can carry only
# slows each download down.
# Options: 1 (one after another) or more, -1 (no limit)
max_connections = 5

# API requests per source per minute. A burst (an artist's whole discography)
# can pass a higher limit and get "429 Too Many Requests"; lower it then.
# Options: a number, -1 (no limit)
requests_per_minute = 35

# How fast to rip. Services limit what an account may download per hour, and
# going over it hour after hour can get the account suspended.
#   "auto"    small jobs (up to ~100 tracks in 6 hours) at full speed, bigger
#             ones at a steady ~80 tracks an hour
#   "fast"    always full speed: fine for an album, not for hours on end
#   "medium"  always ~150 tracks an hour
#   "slow"    always ~80 tracks an hour
# `--pace` sets it for one run.
# Options: "auto", "fast", "medium", "slow"
# pacing = "auto"

# A service's own section can also set its limits: requests_per_minute,
# slow_tracks_per_hour (80), medium_tracks_per_hour (150), max_tracks_per_hour
# (175, where full speed warns) and full_speed_tracks (100, for "auto").

# -- Connection --

# Check SSL certificates. Turn it off only for certificate errors you can't fix.
# Options: true, false
verify_ssl = true

# -- Lyrics --

# Download and embed lyrics. Tidal has them for most tracks; for other sources
# they are looked up on lrclib.net, a free open database, which is told the
# artist, title and length of what you download. Synced (LRC) lyrics where
# there are any, plain text for MP3. Lyrics stay the property of their owners.
# Options: true, false
lyrics = true

# Also save lyrics as a .lrc file next to the track, for players that don't
# read the embedded tag. Never for MP3, which holds plain lyrics already.
# Options: true, false
save_lrc = false


# -----------------------------------------------------------------------------
# QOBUZ
# -----------------------------------------------------------------------------
[qobuz]

# The highest quality to ask for. A track not available in it comes in the
# next one down.
# Options: 1 (320 kbps MP3), 2 (16-bit, 44.1 kHz), 3 (24-bit, up to 96 kHz),
#          4 (24-bit, up to 192 kHz)
quality = 4

# Download the booklet PDFs that come with some albums.
# Options: true, false
download_booklets = true


# -----------------------------------------------------------------------------
# TIDAL
# -----------------------------------------------------------------------------
[tidal]

# The highest quality to ask for.
# Options: 0 (256 kbps AAC), 1 (320 kbps AAC), 2 (16-bit, 44.1 kHz FLAC),
#          3 (best: hi-res FLAC where Tidal has a hi-res master)
quality = 3

# Tidal gives each of its login clients other formats: the default one never
# gets hi-res, the hi-res one gets AAC 320 for everything that isn't hi-res.
# On (with quality 3), each track is asked of the hi-res client first and of the
# default one when there is no hi-res master. Needs a second login.
# Options: true, false
hires_client = true

# Your own Tidal client id and secret. Empty means the built-in ones.
# Options: text, or empty
client_id = ""
client_secret = ""

# Only for the playlist tools and the playlist pages of `streamrip web`.
# Reading and changing your playlists and favourites goes through Tidal's
# official API, which needs a developer app of your own: make one at
# https://developer.tidal.com/dashboard with this redirect URI and the scopes
# collection.read, collection.write, playlists.read, playlists.write and
# user.read. See docs/playlists.md.
# Options: the redirect URI of that app
api_redirect_uri = "http://127.0.0.1:9900/tidal/callback"


# -----------------------------------------------------------------------------
# DEEZER
# -----------------------------------------------------------------------------
[deezer]

# The highest quality to ask for, within what your subscription allows.
# Options: 0 (128 kbps MP3), 1 (320 kbps MP3), 2 (FLAC)
quality = 2

# Take the best quality there is when the one above isn't available.
# Options: true, false
lower_quality_if_not_available = true


# -----------------------------------------------------------------------------
# SOUNDCLOUD
# -----------------------------------------------------------------------------
[soundcloud]

# Nothing to set here. What streamrip finds out is kept in state.toml.


# -----------------------------------------------------------------------------
# SPOTIFY
# -----------------------------------------------------------------------------
[spotify]

# Spotify supplies the track list, tags and cover art. `backend` says where the
# audio comes from.

# -- Audio --

#   "spotify"  Spotify's own audio, at the account's quality. Needs a Soloist
#              API key and one pairing, and runs on Linux only for now.
#   "youtube"  The same recording found on YouTube Music: AAC or MP3.
# A track that "spotify" can't do is taken from YouTube Music instead.
# Options: "spotify", "youtube"
backend = "spotify"

# The name of the device the Spotify app pairs with.
# The Soloist API key (one per person, Premium, made at
# developer.spotify.com/dashboard/soloist) is a secret: it is kept in
# state.toml and never printed or sent anywhere but Spotify.
# Options: any name
device_name = "streamrip"

# -- Login --

# Logging in needs a Spotify app of your own, made by a Premium account at
# https://developer.spotify.com/dashboard. Give it this redirect URI exactly (use
# 127.0.0.1, not localhost), tick "Web API" only, then run `streamrip login
# spotify`. No client secret is needed. See docs/spotify.md.
# Options: the redirect URI of that app
redirect_uri = "http://127.0.0.1:9900/callback"

# -- YouTube Music (the "youtube" backend, and the fallback) --

# The file type. YouTube Music's best AAC stream is kept as it is; anything else
# is re-encoded.
# Options: "m4a" (AAC, with cover art), "mp3"
audio_format = "m4a"

# Bitrate for audio that has to be re-encoded.
# Options: kbps, for example 128, 192, 256, 320
audio_bitrate = 320

# Accept an official music video when YouTube Music has no matching "song"
# (some regions and connections only show videos). Off downloads exact song
# matches only.
# Options: true, false
match_videos = true


# -----------------------------------------------------------------------------
# DATABASES: what was downloaded, and what failed
# -----------------------------------------------------------------------------
[database]

# Keep the IDs of the tracks you downloaded. A track in it is skipped when
# asked for again. `--no-db` turns it off for one run.
# Options: true, false
downloads_enabled = true

# Where that database is. Empty means next to this file.
# Options: a file path, or empty
downloads_path = ""

# Keep the IDs of downloads that failed, so `streamrip repair` can retry them.
# Options: true, false
failed_downloads_enabled = true

# Where that database is. Empty means next to this file.
# Options: a file path, or empty
failed_downloads_path = ""


# -----------------------------------------------------------------------------
# CONVERSION: convert tracks after downloading
# -----------------------------------------------------------------------------
[conversion]

# Off keeps every file as downloaded, which is the highest quality. Turn it on
# for a smaller file or a device that needs another format: the options below
# say what to convert to.
# Options: true, false
enabled = false

# What to convert to.
# Options: "FLAC", "ALAC", "AIFF", "OPUS", "MP3", "VORBIS", "AAC"
codec = "ALAC"

# Files above this sampling rate are downsampled to it. The default leaves
# everything as it is.
# Options: 44100, 48000, 88200, 96000, 176400, 192000 (Hz)
sampling_rate = 192000

# Files with a higher bit depth are reduced to it.
# Options: 16, 24
bit_depth = 24

# Bitrate for the lossy codecs (OPUS, MP3, VORBIS, AAC).
# Options: kbps, for example 128, 192, 256, 320
lossy_bitrate = 320


# -----------------------------------------------------------------------------
# ARTIST FILTERS: for downloading an artist's discography, from any source
# -----------------------------------------------------------------------------
[artist_filters]

# Skip special editions (deluxe, anniversary, collector's, expanded), live
# albums, demos, remixes and various-artists compilations.
# Options: true, false
extras = false

# Of albums with the same title (ignoring anything in brackets), keep only the
# best quality one.
# Options: true, false
repeats = false

# Skip singles (releases with one track).
# Options: true, false
non_albums = false

# Skip albums credited to someone else, such as ones the artist only features
# on.
# Options: true, false
features = false

# Only download remastered albums.
# Options: true, false
non_remaster = false


# -----------------------------------------------------------------------------
# ARTWORK
# -----------------------------------------------------------------------------
[artwork]

# Write the cover into the audio file.
# Options: true, false
embed = true

# The size of the embedded cover. "original" can be up to 30 MB and may fail to
# embed; "large" is recommended.
# Options: "thumbnail", "small", "large", "original"
embed_size = "large"

# Scale the embedded cover down until its longer side is this many pixels
# (same proportions).
# Options: a number of pixels, -1 (don't scale)
embed_max_width = -1

# Also save the cover as a separate jpg, at the highest quality.
# Options: true, false
save_artwork = true

# Scale the saved cover down until its longer side is this many pixels.
# Options: a number of pixels, -1 (don't scale)
saved_max_width = -1


# -----------------------------------------------------------------------------
# METADATA: tags written to the files
# -----------------------------------------------------------------------------
[metadata]

# For tracks of a playlist, set the ALBUM tag to the playlist's name, which
# helps library software that groups by album.
# Options: true, false
set_playlist_to_album = true

# For tracks of a playlist, set the track number to the position in the
# playlist instead of in the album.
# Options: true, false
renumber_playlist_tracks = true

# Tags that are not written. Names: https://github.com/nathom/streamrip/wiki/Metadata-Tag-Names
# Options: a list of tag names, for example ["comment", "genre"]
exclude = []

# When an album or playlist has a clean and an explicit copy of a track, skip
# the clean one. Every track is looked up before the first download starts,
# which delays it a little on sources other than Tidal.
# Options: true, false
prefer_explicit = true

# Let the playlist tools ask MusicBrainz (open and free) about tracks they can't
# find: it knows the other ISRCs of a recording. It is sent the ISRC, or the
# title and artist, of those tracks only, one request a second.
# Options: true, false
musicbrainz = true


# -----------------------------------------------------------------------------
# FILEPATHS: folder and file names
# -----------------------------------------------------------------------------
[filepaths]

# Make a folder for single tracks too, using folder_format.
# Options: true, false
add_singles_to_folder = false

# The name of an album's folder.
# Keys: {albumartist} {title} {year} {bit_depth} {sampling_rate} {container}
#       {id} {albumcomposer} {tracktotal} {version} (the edition)
# Options: text with those keys
folder_format = "{albumartist} - {title} ({year}) [{container}] [{bit_depth}B-{sampling_rate}kHz]"

# The name of a track's file.
# Keys: {id} {tracknumber} {discnumber} {artist} {album} {albumartist}
#       {composer} {title} {albumcomposer} {explicit}
# Options: text with those keys
track_format = "{tracknumber:02}. {artist} - {title}{explicit}"

# Only allow printable ASCII characters in file names.
# Options: true, false
restrict_characters = false

# Shorten file names to this many characters. They are always shortened as far
# as the file system needs, whatever this says.
# Options: a number, 0 (no limit)
truncate_to = 120


# -----------------------------------------------------------------------------
# LAST.FM: playlists are downloaded by searching for their track titles
# -----------------------------------------------------------------------------
[lastfm]

# The source to search on.
# Options: "qobuz", "tidal", "deezer", "soundcloud", "spotify"
source = "qobuz"

# Where to search for what the source above doesn't have. Several are tried in
# turn, comma separated: "tidal,deezer".
# Options: one or more of the sources above, or empty
fallback_source = ""


# -----------------------------------------------------------------------------
# CLI: the command line
# -----------------------------------------------------------------------------
[cli]

# Show progress bars while resolving and downloading.
# Options: true, false
progress_bars = true

# How many search results the interactive menu shows.
# Options: a number
max_search_results = 100

# streamrip asks GitHub for a newer release before every command. Remove the #
# to stop that (no internet, or a script that runs often). Setting
# STREAMRIP_NO_UPDATE_CHECK=1 in the environment does the same.
# Options: true, false
# no_update_check = true
