# Pushes every push to dev, main or a tag on to the copy on opencommit.eu,
# which can't pull a mirror itself. .forgejo/workflows/mirror.yml does the
# same the other way, so a change made on either side reaches the other.
#
# Only fast-forwards: there is no --force, so when the two copies diverged
# the push is refused and this job fails, instead of overwriting work. A
# push that is already there is a no-op, so the two workflows don't loop.
#
# Needs the secret OPENCOMMIT_TOKEN: an access token of the opencommit.eu
# account with write access to its repositories. Without it the job is skipped.
name: Mirror to opencommit.eu

on:
  push:
    branches: [dev, main]
    tags: ["v*"]

concurrency:
  group: mirror-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  push:
    if: github.repository == 'Stensel8/streamrip' && !github.event.deleted
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check for the token
        id: token
        env:
          TOKEN: ${{ secrets.OPENCOMMIT_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "present=true" >>"$GITHUB_OUTPUT"
          else
            echo "::notice::OPENCOMMIT_TOKEN is not set, so nothing is mirrored."
          fi
      - if: steps.token.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # a shallow clone can't be pushed
          persist-credentials: false
      - name: Push to opencommit.eu
        if: steps.token.outputs.present == 'true'
        env:
          TOKEN: ${{ secrets.OPENCOMMIT_TOKEN }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # A tag is pushed as itself, so an annotated tag stays annotated.
          case "$REF" in refs/tags/*) src="$REF" ;; *) src="$SHA" ;; esac
          git push "https://Stensel8:${TOKEN}@opencommit.eu/Stensel8/streamrip.git" "$src:$REF"
