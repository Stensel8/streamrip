# The image for ghcr.io/stensel8/streamrip, built with Podman on amd64 and arm64
# hardware. A pull request builds and tests both, so a dependency without an
# arm64 wheel shows up there. A published release, or "Run workflow" with an
# existing tag, also pushes them and joins them under the version, its minor
# and `latest`; "Run workflow" without a tag only builds and tests. opencommit.eu
# builds the same tag the same way (.forgejo/workflows/container.yml).
name: Container

on:
  pull_request:
    paths:
      - Containerfile
      - .dockerignore
      - .github/workflows/container.yml
      - pyproject.toml
      - uv.lock
      - README.md
      - LICENSE
      - streamrip/**
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: A tag to build and publish again, like v2.7.0. Empty to only build and test.
        required: false
        type: string

permissions:
  contents: read

env:
  IMAGE: ghcr.io/stensel8/streamrip
  TAG: ${{ github.event.release.tag_name || inputs.tag || '' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-latest, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: Build, test and push
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          command -v podman >/dev/null || { sudo apt-get update && sudo apt-get install --yes podman; }
          case "$(uname -m)" in x86_64) arch=amd64 ;; aarch64) arch=arm64 ;; esac
          version=""; [[ "$TAG" == v[0-9]* ]] && version="${TAG#v}"
          image="$IMAGE:${version:-test}-$arch"

          podman build --file Containerfile --tag "$image" \
            --label "org.opencontainers.image.version=${version:-dev}" \
            --label "org.opencontainers.image.revision=$(git rev-parse HEAD)" .
          podman run --rm "$image" --version
          [[ -n "$version" ]] || exit 0   # without a tag: built and tested, nothing to publish
          test "$(podman run --rm "$image" --version)" = "streamrip, version $version"

          podman login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<<"$REGISTRY_TOKEN"
          podman push "$image"

  manifest:
    if: github.event_name == 'release' || inputs.tag != ''
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Join the architectures
        env:
          PRERELEASE: ${{ github.event.release.prerelease }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          tags=("$version")
          # A stable release also moves its minor tag (2.6), and `latest`.
          if [[ "$version" != *-* && "$PRERELEASE" != "true" ]]; then
            tags+=("${version%.*}" latest)
          fi
          podman login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<<"$REGISTRY_TOKEN"
          podman manifest create streamrip:release
          for arch in amd64 arm64; do
            podman manifest add streamrip:release "docker://$IMAGE:$version-$arch"
          done
          for tag in "${tags[@]}"; do
            podman manifest push --all streamrip:release "docker://$IMAGE:$tag"
          done
