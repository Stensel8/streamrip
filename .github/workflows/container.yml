# Builds the container image with Podman, on amd64 and arm64 hardware. A pull
# request only builds it and runs `streamrip --version`, so a dependency
# without an arm64 wheel shows up in the pull request that brings it. A
# published release pushes each architecture to ghcr.io and joins the two
# under the version, its minor version and `latest`. opencommit.eu builds the
# same tag for its own registry (.forgejo/workflows/container.yml).
name: Container

on:
  pull_request:
    paths:
      - Containerfile
      - .dockerignore
      - .github/workflows/container.yml
      - pyproject.toml
      - uv.lock
      - README.md
      - LICENSE
      - streamrip/**
  release:
    types: [published]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/stensel8/streamrip

jobs:
  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and smoke test
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          command -v podman >/dev/null || { sudo apt-get update && sudo apt-get install --yes podman; }
          if [[ -n "$TAG_NAME" ]]; then
            version="${TAG_NAME#v}"
            podman build --tag streamrip:ci \
              --label "org.opencontainers.image.version=$version" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" .
            test "$(podman run --rm streamrip:ci --version)" = "streamrip, version $version"
          else
            podman build --tag streamrip:ci .
            podman run --rm streamrip:ci --version
          fi

      - name: Push this architecture
        if: github.event_name == 'release'
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
          ARCH: ${{ matrix.arch }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          podman login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<<"$REGISTRY_TOKEN"
          podman push streamrip:ci "docker://$IMAGE:${TAG_NAME#v}-$ARCH"

  manifest:
    if: github.event_name == 'release'
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Join the architectures
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${TAG_NAME#v}"
          tags=("$version")
          # A stable release also moves its minor tag (2.6), and `latest`.
          if [[ "$version" != *-* ]]; then
            tags+=("${version%.*}")
          fi
          if [[ "$PRERELEASE" != "true" ]]; then
            tags+=(latest)
          fi

          podman login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<<"$REGISTRY_TOKEN"
          podman manifest create streamrip:release
          for arch in amd64 arm64; do
            podman manifest add streamrip:release "docker://$IMAGE:$version-$arch"
          done
          for tag in "${tags[@]}"; do
            podman manifest push --all streamrip:release "docker://$IMAGE:$tag"
          done
