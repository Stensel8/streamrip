name: CodeQL

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  schedule:
    # Weekly, so new queries also run on code nobody touched.
    - cron: "33 20 * * 2"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # A pull request from a fork gets a read-only token, which can't upload results.
    # What it merges is scanned on the push to dev.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write # upload the results
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Python is the program; actions covers the workflows in .github/workflows.
        # CodeQL has no queries for the shell and PowerShell installers.
        language: [python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # CodeQL no longer installs Python dependencies. With the project's own Python
      # and its dependencies in place, calls into aiohttp, requests and the rest
      # resolve, which the data-flow queries need to follow input through them.
      - name: Set up Python
        if: matrix.language == 'python'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: matrix.language == 'python'
      - name: Install dependencies
        if: matrix.language == 'python'
        # The versions of uv.lock, which streamrip ships with; streamrip itself
        # is the checkout, and the ffmpeg binary has nothing to analyze.
        run: |
          uv export --locked --no-dev --no-emit-project -o requirements.txt
          python -m pip install --require-hashes -r requirements.txt

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
