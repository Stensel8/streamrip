[project]
name = "streamrip"
version = "2.4.5"
description = "A fast, all-in-one music downloader for Qobuz, Deezer, Tidal, and SoundCloud"
authors = [{ name = "nathom", email = "nathanthomas707@gmail.com" }]
maintainers = [{ name = "Stensel8" }]
license = "GPL-3.0-only"
readme = "README.md"
requires-python = ">=3.14,<4.0"
keywords = ["hi-res", "free", "music", "download"]
classifiers = [
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "mutagen>=1.47,<2",
  "tomlkit>=0.13,<1",
  "pathvalidate>=3.2,<4",
  "simple-term-menu>=1.6,<2; sys_platform != 'win32'",
  "pick>=2.4,<3; sys_platform == 'win32'",
  "windows-curses>=2.4,<3; sys_platform == 'win32'",
  "Pillow>=11,<13",
  "deezer-py>=1.3.7,<2",
  "pycryptodomex>=3.20,<4",
  "m3u8>=6,<7",
  "aiofiles>=24.1",
  "aiohttp>=3.11,<4",
  "aiolimiter>=1.2,<2",
  "rich>=13.9",
  "click>=8.1,<9",
  "click-help-colors>=0.9.4,<0.10",
  "requests>=2.32,<3",
  # Drives a browser for automatic Qobuz login: an already-installed
  # Chrome-family browser when there is one (no download), or its own
  # browser after asking, when there isn't.
  "playwright>=1.40,<2",
]

[project.optional-dependencies]
# Use certifi's CA bundle instead of the system certificates.
ssl = ["certifi>=2024.7.4"]
# A prebuilt ffmpeg, for when there's no system ffmpeg (or none on PATH).
ffmpeg = ["imageio-ffmpeg>=0.5"]

[project.scripts]
streamrip = "streamrip.rip:rip"

[project.urls]
Homepage = "https://github.com/Stensel8/streamrip"
Repository = "https://github.com/Stensel8/streamrip"
"Bug Reports" = "https://github.com/Stensel8/streamrip/issues"
Upstream = "https://github.com/nathom/streamrip"

[tool.poetry]
packages = [{ include = "streamrip" }]

[tool.poetry.group.dev.dependencies]
ruff = ">=0.8"
pytest = ">=8.3"
pytest-mock = ">=3.14"
pytest-asyncio = ">=0.25"
certifi = ">=2024.7.4"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
log_level = "DEBUG"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
log_cli = true

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
select = ["E4", "E7", "E9", "F", "I", "ASYNC", "N", "RUF", "ERA001"]
# os.path.isfile/getsize in async code are cheap stat calls, not I/O worth a
# thread hop.
ignore = ["ASYNC240"]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
# Tests read small fixture files synchronously and keep explanatory comments.
"tests/**" = ["ASYNC230", "ERA001", "RUF012"]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"
